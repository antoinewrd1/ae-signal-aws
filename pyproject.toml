[project]
name = "ae-signal"
version = "0.1.0"
description = "Serverless AWS pipeline for FDA adverse event ingestion, transformation, and LLM enrichment"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "requests>=2.31",
    "pydantic>=2.6",
    "tenacity>=8.2",
]

[project.optional-dependencies]
stream = [
    "confluent-kafka>=2.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "moto[s3,lambda,sts]>=5.0",
    "responses>=0.25",
    "confluent-kafka>=2.4",
    "pyspark>=3.5",
    "ruff>=0.4",
    "black>=24.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
# `from pyspark.sql import functions as F` is the universal PySpark idiom.
ignore = ["N812"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
