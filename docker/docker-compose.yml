# Local Kafka-API broker. Unused until day 2.
# Redpanda speaks the Kafka protocol, so producer/consumer code written
# against it is real Kafka client code - but this is NOT managed MSK.
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: ae-signal-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      retries: 10
