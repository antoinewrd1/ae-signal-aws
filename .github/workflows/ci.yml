name: ci

on:
  push:
    branches: [main]
  pull_request:

# No AWS credentials anywhere in this workflow. Every test mocks its
# dependencies, so CI can run on a fork's pull request without granting
# anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the local development interpreter. PySpark lags new Python
          # releases, and driver/worker version agreement is load-bearing.
          python-version: "3.12"
          cache: pip

      - name: Set up Java for Spark
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          black --check src tests

      - name: Test
        run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.1"

      - name: Format check
        run: terraform -chdir=infra fmt -check -recursive

      # -backend=false validates syntax without credentials, so this job stays
      # free of AWS access entirely.
      - name: Validate
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate
